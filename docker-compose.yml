services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:schedulerpass@db:5432/scheduler
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  scheduler:
    build: .
    command: python -m app.services.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:schedulerpass@db:5432/scheduler
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: .
    command: python -m app.services.worker
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:schedulerpass@db:5432/scheduler
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: schedulerpass
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  postgres_data:
